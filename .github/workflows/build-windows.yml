# 构建 Windows 安装包并挂到 Release 上
#
# 为什么走 CI 而不是本地直传：本地 git 凭据管理器发的是 OAuth 令牌
# （gho_ 开头），它能 push、但 GitHub 限制它上传 release 二进制资产
# （会返回 422 Bad Size，5 字节文件也一样，跟体积无关）。
# Actions 自带的 GITHUB_TOKEN 没有这个限制。
#
# 手动触发：Actions -> Build Windows Installer -> Run workflow
# 默认挂到已存在的 v0.1.0；改输入框可以挂到别的 tag。

name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '挂到哪个 Release 标签'
        required: true
        default: 'v0.1.0'
      model:
        description: '打进安装包说明里的默认模型'
        required: false
        default: 'small'

permissions:
  contents: write   # 上传 release 资产需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Windows runner 控制台默认 cp1252，脚本里的中文提示会抛
      # UnicodeEncodeError。脚本内部已做 reconfigure 兜底，这里再加一层。
      - name: 设置控制台编码
        shell: pwsh
        run: "[Console]::OutputEncoding = [System.Text.Encoding]::UTF8"

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow pytest

      - name: 安装 Inno Setup
        # runner 镜像可能已预装 Inno Setup，--allow-downgrade 避免非零退出
        run: choco install innosetup --yes --no-progress || true

      - name: 确认图标
        run: python tools/make_icon.py --check

      # 0.1.0 发出去的包启动即崩（_check_assets 方法被批量编辑整行覆盖），
      # 当时没有任何自动化检查拦它。测试不过就不许出包。
      - name: 跑测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: 构建 exe
        run: python -m PyInstaller SoundTrace.spec --noconfirm --clean

      - name: 构建安装包
        run: iscc SoundTrace.iss

      - name: 确认产物
        shell: pwsh
        run: |
          $f = Get-ChildItem installer\*.exe
          if (-not $f) { throw "没有生成安装包" }
          "安装包: $($f.Name)  $([math]::Round($f.Length/1MB,1))MB"
          $e = Get-Item dist\SoundTrace\SoundTrace.exe
          "exe: $($e.Name)  $([math]::Round($e.Length/1MB,1))MB"

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SoundTrace ${{ inputs.model }}
          body: |
            本地实时语音转文字。首次启动会下载约 500MB 的
            whisper.cpp 运行时和模型（只需一次），之后完全离线运行。

            - 引擎：whisper.cpp（MIT）
            - 模型：${{ inputs.model }}
            - 平台：Windows x64
          files: installer/*.exe
          fail_on_unmatched_files: true
